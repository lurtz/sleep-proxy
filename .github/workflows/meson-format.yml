name: Meson-format

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies for build
        run: pip install meson
      - name: Check meson formatting
        run: meson format --recursive --check-only
