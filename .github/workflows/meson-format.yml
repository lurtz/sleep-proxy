name: Meson-format

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies for build
        run: sudo apt install meson
      - name: Check meson formatting
        run: meson fmt --recursive --check-only
